controller_manager:
  ros__parameters:
    update_rate: 50 # Tần số cập nhật 50Hz (1ms) cho thời gian thực

    # Broadcaster phát trạng thái tất cả các khớp lên topic /joint_states
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Controller điều khiển quỹ đạo 6 khớp của cánh tay Aubo i10
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Controller điều khiển ngón tay gắp DH AG95
    gripper_controller:
      type: position_controllers/GripperActionController

arm_controller:
  ros__parameters:
    # Khai báo chính xác 6 tên khớp chủ động của Aubo i10
    joints:
      - shoulder_joint
      - upperArm_joint
      - foreArm_joint
      - wrist1_joint
      - wrist2_joint
      - wrist3_joint

    # Giao diện nhận lệnh điều khiển (khuyên dùng position hoặc velocity cho Sim2Real)
    command_interfaces:
      - position

    # Giao diện đọc trạng thái từ Gazebo / phần cứng thực
    state_interfaces:
      - position
      - velocity

    # Cho phép điều khiển độc lập từng khớp khi cần
    allow_partial_joints_goal: false

    # Giới hạn dung sai thời gian và vị trí để đảm bảo tính an toàn
    state_publish_rate: 100.0
    action_monitor_rate: 20.0

    # Cấu hình giới hạn an toàn (Tránh va đập/rung giật cơ khí)
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
      shoulder_joint: { trajectory: 0.0, goal: 0.00 }
      upperArm_joint: { trajectory: 0.0, goal: 0.00 }
      foreArm_joint: { trajectory: 0.0, goal: 0.00 }
      wrist1_joint: { trajectory: 0.0, goal: 0.00}
      wrist2_joint: { trajectory: 0.0, goal: 0.00 }
      wrist3_joint: { trajectory: 0.0, goal: 0.00 }

gripper_controller:
  ros__parameters:
    joint:  dh_ag95_left_outer_knuckle_joint
    action_ns: gripper_cmd
    goal_tolerance: 0.01
    stalled_velocity_threshold: 0.001
    stall_timeout: 1.0
